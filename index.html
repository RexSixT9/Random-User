<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random User</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <div class="container p-4">
      <div class="flex flex-col items-center">
        <h3 class="text-center text-2xl font-bold mb-4">Random User</h3>
        <div
          class="max-w-md p-4 flex flex-col text-center items-center space-y-2 mb-5"
          id="result"
        ></div>
        <button
          onclick="fetchUser()"
          class="bg-black rounded-md px-2 py-3 text-white font-bold"
        >
          Get User
        </button>
      </div>
    </div>

    <script>
      async function fetchUser() {
        const res = await fetch("https://randomuser.me/api/");
        const data = await res.json();
        displayUser(data.results[0]);
        // console.log(data.results[0]);
      }

      function displayUser(user) {
        const card = document.getElementById("result");
        card.innerHTML = `
            <img src='${user.picture.thumbnail}' class="object-cover w-20 h-20 rounded-full"></img>
            <p class="text-xl font-bold">${user.name.first + " " + user.name.last}</p>
            <p class="text-md">Gender: ${user.gender}</p>
            <p class="text-md">Email: ${user.email}</p>
            <p class="text-md">Phone: ${user.phone}</p>
        `;
      }
      fetchUser();
    </script>
  </body>
</html>
